<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 573" role="img" aria-label="Jaqueline Almeida">
<!-- Her J, drawn then flooded. Same technique as Brazier's logo-anim.svg: every
     path carries pathLength="1", so ONE stroke-dashoffset animation traces any
     outline with nothing measuring path lengths, and the fill floods in behind
     the line once the outline is closed. CSS animations inside an SVG run when
     it is used as an <img>, so no script on the page can fall out of step.

     Each path carries its FULL animation shorthand including the delay: a
     shared `.p{animation:...}` with a per-path `animation-delay` override drops
     the second animation's delay in Chromium, and the fill never arrives. -->
<style>
/* THE FINISHED MARK IS THE DEFAULT, and the animation only replays it.

   It used to be the other way round: .p started fully invisible and two chained
   animations built it up, so anything that stopped the second one left the mark
   half made. That is not hypothetical, it is the bug the note below was already
   describing: when Chromium drops the second animation's delay, .p0 ends up
   filled and .p1 never does, and her logo renders as a bare J with an outline
   beside it. Jaque reported seeing exactly that on the homepage and it could
   not be reproduced on demand (2026-09-26), which is what an intermittent
   animation bug looks like from the outside.

   Inverted, the worst case is a logo that does not animate, which is simply a
   logo. ONE animation per path rather than two chained, so there is no second
   delay left to drop. */
.p{
  fill:rgba(35,34,40,1);
  stroke:#232228;stroke-width:14;stroke-linejoin:round;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:0;stroke-opacity:0;
}
.p0{animation:ink 1.65s cubic-bezier(.65,0,.35,1) .05s both}
.p1{animation:ink 1.25s cubic-bezier(.65,0,.35,1) .62s both}
/* Percentages, so one set of keyframes serves both durations: the outline
   traces over the first 70% and floods in over the last 30%. */
@keyframes ink{
  0%{fill:rgba(35,34,40,0);stroke-opacity:1;stroke-dashoffset:1}
  70%{fill:rgba(35,34,40,0);stroke-opacity:1;stroke-dashoffset:0}
  100%{fill:rgba(35,34,40,1);stroke-opacity:0;stroke-dashoffset:0}
}
/* Nothing to restore: the base state is already the finished mark. */
@media (prefers-reduced-motion:reduce){ .p0,.p1{animation:none} }
</style>
